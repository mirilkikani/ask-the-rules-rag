name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only what the tests need (no torch, no model)
        run: pip install pytest pdfplumber python-dotenv google-genai
      - name: Run tests
        run: pytest -q
